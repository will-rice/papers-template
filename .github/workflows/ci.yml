name: Template CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: "3.12"
      - name: Install uv
        timeout-minutes: 2
        run: python -m pip install uv==0.8.17
      - name: Sync locked environment
        timeout-minutes: 5
        run: uv sync --locked
      - name: Run template smoke test
        timeout-minutes: 15
        run: ./scripts/smoke-test.sh
      - name: Run pre-commit
        timeout-minutes: 5
        run: uv run pre-commit run --all-files
