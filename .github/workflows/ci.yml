name: Template CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: "3.12"
      - name: Install uv
        timeout-minutes: 2
        run: python -m pip install uv==0.11.8
      - name: Sync locked environment
        timeout-minutes: 5
        run: uv sync --locked
      - name: Run template smoke test
        timeout-minutes: 15
        run: ./scripts/smoke-test.sh
      - name: Run pre-commit
        timeout-minutes: 5
        run: uv run pre-commit run --all-files

  # Renders a repository and builds its conversion environment with the same
  # script the nightly uses, then converts real fixtures, so a template change
  # that breaks the converter fails here instead of in six nightly runs.
  conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: "3.12"
      - name: Install uv
        timeout-minutes: 2
        run: python -m pip install uv==0.11.8
      - name: Render a repository from the template
        timeout-minutes: 5
        run: |
          uv sync --locked
          uv run copier copy --trust --defaults --vcs-ref HEAD \
            -d project_name="Example Papers" -d project_slug=example-papers \
            -d topic_description="Example research papers" \
            . "$RUNNER_TEMP/example-papers"
      - name: Set up the conversion environment
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/example-papers
        run: .github/scripts/setup-conversion.sh --extra dev
      - name: Convert with the real tools
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}/example-papers
        run: uv run pytest -m conversion
