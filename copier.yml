_subdirectory: template
_answers_file: .copier-answers.yml
_skip_if_exists:
  - papers
  - papers.csv
  - .papers-state.yml
  - .cache
  - .pytest_cache
  - .mypy_cache
  - .ruff_cache
project_name:
  type: str
  help: Human-readable repository name
project_slug:
  type: str
  help: GitHub repository slug
  validator: "{% if not (project_slug | regex_search('^[a-z0-9][a-z0-9-]*-papers$')) %}Use a lowercase *-papers slug{% endif %}"
topic_description:
  type: str
  help: One-line topic description
alphaxiv_folder_id:
  type: str
  default: ""
  help: ID of a shared alphaXiv folder to link from the README (empty for none)
  validator: "{% if alphaxiv_folder_id and not (alphaxiv_folder_id | regex_search('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')) %}Use the folder ID from its alphaXiv share link{% endif %}"
template_version:
  type: str
  default: "0.1.0"
