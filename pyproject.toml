[project]
name = "papers-template"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "copier>=9.10,<10",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
  "ty>=0.0.84,<0.1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "types-PyYAML>=6.0.12,<7",
  "httpx>=0.28,<0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The migration script runs against the generated package.
pythonpath = ["template/src", "scripts"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ty.environment]
# The migration script imports the rendered package; the smoke test
# type-checks the rendered repository itself.
extra-paths = ["template/src", "scripts"]

[tool.ty.src]
include = ["scripts", "tests"]
