[project]
name = "papers-template"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "copier>=9.10,<10",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.28,<0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
