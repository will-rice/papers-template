name: Format complete corpus

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: Number of bounded formatting shards (1-32)
        required: true
        default: "8"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: format-complete-corpus
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Validate shard count and build matrix
        id: matrix
        timeout-minutes: 1
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
        run: |
          python - <<'PY'
          import json
          import os

          raw = os.environ["SHARD_COUNT"]
          if not raw.isascii() or not raw.isdecimal():
              raise SystemExit("shard_count must be an integer from 1 through 32")
          count = int(raw)
          if not 1 <= count <= 32:
              raise SystemExit("shard_count must be an integer from 1 through 32")
          matrix = {
              "include": [
                  {"shard": index, "count": count}
                  for index in range(count)
              ]
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("matrix=" + json.dumps(matrix, separators=(",", ":")), file=output)
          PY

  format:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: "3.12"
      - name: Install uv
        timeout-minutes: 2
        run: python -m pip install uv==0.8.17
      - name: Sync locked environment
        timeout-minutes: 5
        run: uv sync --locked --extra dev
      - name: Validate configuration
        timeout-minutes: 1
        run: uv run papers-pipeline validate --config papers.yml
      - name: Format shard
        timeout-minutes: 15
        env:
          SHARD_COUNT: ${{ matrix.count }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: >-
          uv run papers-pipeline format-corpus
          --shard-index "$SHARD_INDEX"
          --shard-count "$SHARD_COUNT"
      - name: Create binary patch
        timeout-minutes: 2
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: git diff --binary > "format-${SHARD_INDEX}.patch"
      - name: Upload patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 3
        with:
          name: format-${{ matrix.shard }}
          path: format-${{ matrix.shard }}.patch
          if-no-files-found: error

  combine:
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
      - name: Download patches
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        timeout-minutes: 3
        with:
          pattern: format-*
          path: patches
          merge-multiple: true
      - name: Apply patches in shard order
        timeout-minutes: 5
        shell: bash
        run: |
          while IFS= read -r -d '' patch; do
            if [[ -s "$patch" ]]; then
              git apply --index "$patch"
            fi
          done < <(find patches -type f -name 'format-*.patch' -print0 | sort -zV)
      - name: Open formatting pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        timeout-minutes: 5
        with:
          base: main
          branch: maintenance/format-corpus
          delete-branch: true
          title: "style: format complete paper corpus"
          commit-message: "style: format complete paper corpus"
