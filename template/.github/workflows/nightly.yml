name: Nightly papers

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: "3.12"
      - name: Install uv
        timeout-minutes: 2
        run: python -m pip install uv==0.8.17
      - name: Sync locked environment
        timeout-minutes: 5
        run: uv sync --locked --extra dev
      - name: Validate configuration
        timeout-minutes: 1
        run: uv run papers-pipeline validate --config papers.yml
      - name: Run and publish bounded batches
        timeout-minutes: 105
        run: .github/scripts/nightly.sh
