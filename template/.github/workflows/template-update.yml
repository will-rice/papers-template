name: Update papers template

on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: template-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: "3.12"
      - name: Install update tools
        timeout-minutes: 2
        run: python -m pip install uv==0.8.17 copier==9.10.2
      - name: Resolve latest template release
        id: release
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE_REPOSITORY: will-rice/papers-template
        run: |
          ref="$(gh api "repos/$TEMPLATE_REPOSITORY/releases/latest" --jq .tag_name)"
          test -n "$ref"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - name: Update and validate repository
        id: update
        timeout-minutes: 20
        env:
          TEMPLATE_REF: ${{ steps.release.outputs.ref }}
        run: .github/scripts/template-update.sh
      - name: Open update pull request
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        timeout-minutes: 3
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: automation/update-papers-template
          delete-branch: true
          title: "chore: update papers template"
          body: "Automated Copier update. Schema, pre-commit, and the offline suite passed before this pull request was opened."
          commit-message: "chore: update papers template"
