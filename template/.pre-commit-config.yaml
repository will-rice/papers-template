repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        additional_dependencies:
          - httpx==0.28.1
          - pydantic==2.11.7
          - pytest==8.4.2
          - pytest-asyncio==1.1.0
          - types-PyYAML==6.0.12.20250822
